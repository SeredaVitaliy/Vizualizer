# Сборка Windows-версии и выпуск на GitHub.
# Срабатывает на каждый push в main: если в package.json новая версия и выпуска vX.Y.Z ещё нет —
# собирает портативный exe и создаёт выпуск с тегом. Описание берётся из releases/X.Y.Z.md.
name: Сборка и выпуск

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия из package.json
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Проверить, есть ли уже такой выпуск
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Выпуск v${{ steps.v.outputs.version }} уже есть — сборка не нужна."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        if: steps.check.outputs.exists == 'false'
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Собрать exe
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Создать выпуск
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="releases/$V.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "v$V" dist/Studio-$V-portable.exe --title "Студия $V" --target "${{ github.sha }}" "${ARGS[@]}"
